global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'mindspring'
    replica: '1'

scrape_configs:
  - job_name: 'mindspring-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']